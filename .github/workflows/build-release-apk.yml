name: Build signed release APK

# Deliberately separate from build-apk.yml (which builds an unsigned debug
# APK on every push) — cutting a release is a deliberate action, not
# something that should happen automatically on every commit. Manual
# trigger only; run it from the Actions tab when you're ready to ship a
# build to school crews.
#
# Needs three repo secrets set under Settings -> Secrets and variables ->
# Actions (see README's "Signed release build" section for how to get
# these values from the keystore):
#   RELEASE_KEYSTORE_BASE64   - `base64 -w0 open-door-live-release.jks`
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_PASSWORD
# RELEASE_KEY_ALIAS isn't a secret (it's not sensitive on its own) but is
# still read from a repo secret here for convenience, so it lives in one
# place with the rest — set it to `open-door-live` unless a different
# keystore was generated with a different alias.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      # Decoded straight to the fixed path app/build.gradle.kts's
      # signingConfigs block looks for (releaseKeystoreFile) — gitignored,
      # never touches the repo, and this runner is thrown away when the
      # job ends either way.
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Same rate-limit retry as build-apk.yml's debug build.
        run: |
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --stacktrace && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Build attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/release-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: broadcaster-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
